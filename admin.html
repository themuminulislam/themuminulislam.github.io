<!doctype html><html><meta charset=utf-8><link rel=icon type="image/svg+xml" href=favicon.svg><meta name=viewport content="width=device-width,initial-scale=1"><title>Admin</title>
<link rel=stylesheet href=base.css>
<style>main{max-width:1200px}#app{display:grid;grid-template-columns:180px 1fr;gap:24px}.tabs{display:flex;flex-direction:column;gap:6px;align-self:start}.tabs button{text-align:left;background:none;color:var(--fg);border-color:var(--ln)}.tabs .on{background:var(--fg);color:var(--bg)}.it{border:1px solid var(--ln);border-radius:12px;padding:14px;margin:0 0 14px;background:var(--cd)}.r{display:grid;grid-template-columns:1fr 1fr;gap:8px}.x{background:#c0392b;border-color:#c0392b;color:#fff}#sw{display:flex;align-items:center;gap:8px;flex:1;min-width:0}#sm{white-space:nowrap;font-size:13px}#sw input{width:100%;max-width:340px}.tabs button{display:flex;justify-content:space-between;align-items:center;gap:8px}.nb{background:#ff4d6d;color:#fff;border-radius:999px;font-size:12px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}.nbt{background:#ff4d6d;color:#fff;border-radius:6px;font-size:11px;padding:1px 7px}.it.nw{border-color:#ff4d6d;box-shadow:inset 4px 0 0 #ff4d6d}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-bottom:24px}.dc{border:1px solid var(--ln);border-radius:16px;padding:16px;background:var(--cd)}.dc b{display:block;font-size:28px}.dc span{color:var(--mu);font-size:13px}.dc.hl{border-color:#ff4d6d;cursor:pointer}.gl2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.gl2 span{position:relative}.gl2 .x{position:absolute;top:2px;right:2px;padding:2px 6px}
#sb{display:flex;align-items:center;gap:12px;position:sticky;top:var(--nh,64px);z-index:20;padding:10px 0;margin-bottom:10px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px)}@media(max-width:720px){#app{grid-template-columns:1fr}.tabs{flex-direction:row;flex-wrap:nowrap;overflow-x:auto}.tabs button{white-space:nowrap}.r{grid-template-columns:1fr}}</style>
<div id=nav></div><main id=mn></main>
<script src=firebase-config.js></script><script src=store.js></script><script>
window.AD=1;window.DIRTY=0;window.onDirty=()=>{const m=$('#sm');if(m)m.textContent='● Unsaved changes'};addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}});
hdr('admin');let tab='dash';
const S={works:[['title','bi'],['desc','tbi'],['cat','sel'],['sale','chk'],['price','num'],['file','txt'],['free','chk'],['full','chk'],['color','color'],['img','img'],['gallery','gal']],cats:[['name','bi']],cos:[['name','bi'],['url','txt'],['logo','img']],exp:[['role','bi'],['org','bi'],['from','txt'],['to','txt'],['desc','tbi']],skills:[['name','bi']],
p:[['name','bi'],['role','bi'],['s1','bi'],['s2','bi'],['bio','tbi'],['photo','img'],['email','txt'],['phone','txt'],['addr','bi'],['wa','txt'],['dev','txt'],['foot','tbi'],['show_who','chk'],['show_s1','chk'],['show_s2','chk'],['show_bio','chk'],['show_soc','chk'],['show_stats','chk']],pay:[['bkash','txt'],['nagad','txt'],['bank','txt']],tpl:[['ack','tbi'],['ok','tbi']],reviews:[['name','txt'],['email','txt'],['stars','num'],['text','txt']],st:[['hero_size','num'],['hero_weight','wt'],['h1_size','num'],['h1_weight','wt'],['h2_size','num'],['h2_weight','wt'],['body_size','num']],soc:[['name','txt'],['url','txt'],['icon','img']],pages:[['title','bi'],['body','tbi'],['menu','chk'],['foot','chk']]};
const TABS={dash:'ড্যাশবোর্ড',works:'কাজ',cats:'ক্যাটাগরি',orders:'অর্ডার',msgs:'মেসেজ',p:'প্রোফাইল',cos:'প্রতিষ্ঠান',exp:'অভিজ্ঞতা',skills:'দক্ষতা',pay:'পেমেন্ট',tpl:'বার্তা',st:'ফন্ট সাইজ',reviews:'রিভিউ',pages:'পেজ',soc:'সোশ্যাল',ui:'লেখা (UI)',set:'সেটিংস'};
const one=(p,k,ty,v)=>{const q=p+'.'+k;
if(ty=='chk')return `<label><input type=checkbox style="width:auto" data-p=${q} ${v?'checked':''}> ${k}</label>`;
if(ty=='wt')return `<label>${k}</label><select data-p=${q}>${[400,500,600,700,800].map(n=>`<option ${n==v?'selected':''}>${n}</option>`).join('')}</select>`;
if(ty=='gal')return `<label>${k} (select many)</label><input type=file multiple accept=image/* data-g=${p}.${k}><div class=gl2>${(v||[]).map((s,i)=>`<span><img src="${s}" height=56><button class=x onclick="gdel('${p}.${k}',${i})">${ic('x',12)}</button></span>`).join('')}</div>`;
if(ty=='sel')return `<label>${k}</label><select data-p=${q}>${db.cats.map(c=>`<option value=${c.id} ${c.id==v?'selected':''}>${c.name_bn}</option>`).join('')}</select>`;
if(ty=='img')return `<label>${k}</label><input type=file accept=image/* data-p=${q}>${v?`<img src="${v}" height=50>`:''}`;
if(ty=='tbi')return `<label>${k}</label><textarea rows=3 data-p=${q}>${v??''}</textarea>`;
return `<label>${k}</label><input type=${ty=='num'?'number':ty=='color'?'color':'text'} data-p=${q} value="${esc(v)}">`};
const fld=(p,o,[k,ty])=>ty=='bi'||ty=='tbi'?`<div class=r>${['bn','en'].map(l=>`<div>${one(p,k+'_'+l,ty=='bi'?'txt':'tbi',o[k+'_'+l])}</div>`).join('')}</div>`:one(p,k,ty,o[k]);
const form=k=>S[k].map(f=>fld(k,db[k],f)).join('');
const lst=k=>`<button onclick="add('${k}')">+ Add</button><br><br>`+db[k].map((o,i)=>`<div class=it>${k=='soc'?`<img src="${o.icon||soci(skey(o.name))}" width=40 height=40 style="border-radius:50%" alt="">`:''}${S[k].map(f=>fld(k+'.'+i,o,f)).join('')}<br><button class=o onclick="mv('${k}',${i})">${ic('up',14)}</button> <button class=x onclick="del('${k}',${i})">Delete</button></div>`).join('');
const pa=p=>{const z=p.split('.');let o=db;z.slice(0,-1).forEach(k=>o=o[k]);return [o,z.at(-1)]},gdel=(p,i)=>{const [o,k]=pa(p);o[k].splice(i,1);save();show()};
const add=k=>{const o={id:Date.now()+''};if(k=='works')Object.assign(o,{cat:db.cats[0]?.id,color:'#2b50ff',sale:false,free:false,full:true,gallery:[],price:0,file:'',title_bn:'নতুন কাজ',title_en:'New work'});if(k=='pages')Object.assign(o,{title_bn:'নতুন পেজ',title_en:'New page',body_en:'',menu:true});db[k].unshift(o);save();show()};
const del=(k,i)=>{if(!confirm('Delete?'))return;const o=db[k][i];if(k=='cats'){const r=db.cats.find(c=>c.id!=o.id);db.works.forEach(w=>{if(w.cat==o.id)w.cat=r?r.id:''})}db[k].splice(i,1);save();show()};
const mv=(k,i)=>{if(i){[db[k][i-1],db[k][i]]=[db[k][i],db[k][i-1]];save();show()}};
const ord=(i,s)=>{db.orders[i].status=s;save();show()};
const ph=s=>'88'+String(s).replace(/\D/g,'').replace(/^88/,'');
const orders=()=>db.orders.length?db.orders.map((o,i)=>{const ws=(o.items||[o.work]).map(x=>db.works.find(y=>y.id==x)||{}),Lo=o.l,body=fill(db.tpl['ok_'+Lo]||'',o)+'\n\n'+ws.map(w=>(w['title_'+Lo]||'')+': '+(w.file||'')).join('\n');
return `<div class="it ${o.status=='pending'?'nw':''}"><b>#${o.id}</b> ${ws.map(w=>w['title_'+Lo]).join(', ')} — ৳${o.price} — ${o.method}<br>${o.name} · ${o.email} · ${o.phone}<br>From: ${o.from} · TrxID: <b>${o.trx}</b> · <b>${o.status}</b><br><br>${o.status=='pending'?`<button onclick="ord(${i},'approved')">${ic('check',16)} Approve</button> <button class=x onclick="ord(${i},'rejected')">${ic('x',16)} Reject</button>`:''}${o.status=='approved'?`<a class=btn href="mailto:${o.email}?subject=${encodeURIComponent('Your file / আপনার ফাইল')}&body=${encodeURIComponent(body)}">${ic('mail',16)} Send link</a> <a class="btn o" target=_blank href="https://wa.me/${ph(o.phone)}?text=${encodeURIComponent(body)}">WhatsApp</a>`:''}</div>`}).join(''):'—';
const rv=(i,s)=>{db.reviews[i].status=s;save();show()};
const reviews=()=>db.reviews.map((r,i)=>`<div class="it ${r.status=='pending'?'nw':''}"><b>${r.status}</b> · ${(db.works.find(x=>x.id==r.work)||{}).title_en||''}${S.reviews.map(f=>fld('reviews.'+i,r,f)).join('')}<br>${r.status!='approved'?`<button onclick="rv(${i},'approved')">${ic('check',16)} Approve</button> `:`<button class=o onclick="rv(${i},'pending')">Unpublish</button> `}<button class=x onclick="db.reviews.splice(${i},1);save();show()">Delete</button></div>`).join('')||'—';
const msgs=()=>db.msgs.map((m,i)=>`<div class="it ${m.read?'':'nw'}">${m.read?'':'<b class=nbt>NEW</b> '}<b>${m.name}</b> · ${m.email}<br>${m.msg}<br><br>${m.read?'':`<button onclick="db.msgs[${i}].read=1;save();show()">Mark read</button> `}<a class="btn o" href="mailto:${m.email}">Reply</a> <button class=x onclick="db.msgs.splice(${i},1);save();show()">Delete</button></div>`).join('')||'—';
const dash=()=>{const s=db.stats,ap=db.orders.filter(o=>o.status=='approved'),rev=ap.reduce((x,o)=>x+ +o.price,0),pn=db.orders.filter(o=>o.status=='pending').length,pr=db.reviews.filter(r=>r.status=='pending').length,um=db.msgs.filter(m=>!m.read).length;
const C=(l,v,g)=>`<div class="dc ${g&&v?'hl':''}" ${g?`onclick="tab='${g}';show()"`:''}><b>${v}</b><span>${l}</span></div>`;
return `<div class=dg>${C('Page views',s.v)}${C('Visitors',s.u)}${C('Downloads',s.d+ap.length)}${C('Orders pending',pn,'orders')}${C('Orders approved',ap.length)}${C('Revenue (BDT)',rev)}${C('Reviews pending',pr,'reviews')}${C('New messages',um,'msgs')}</div><h3>Top works by views</h3>${Object.entries(s.w).sort((x,y)=>y[1]-x[1]).slice(0,5).map(([id,n])=>`<p>${t(db.works.find(x=>x.id==id)||{title_en:id},'title')} — <b>${n}</b></p>`).join('')||'<p class=mu>—</p>'}<p class=mu>Counts cover this browser only until the live server is added. Turn on 'show_stats' in Profile to show visitors, views and downloads above the home footer.</p>`};
const ui=()=>Object.keys(U).map(k=>`<div class=r>${[0,1].map(j=>{const l=j?'en':'bn';return `<div><label>${k} · ${l}</label><input data-p=ui.${k}_${l} value="${esc(db.ui[k+'_'+l]??U[k][j])}"></div>`}).join('')}</div>`).join('');
const set=()=>`${FBON?'<button class=o onclick="firebase.auth().signOut().then(()=>location.reload())">Logout</button><br><br>':''}<label>Admin password</label><input data-p=pw value="${esc(db.pw)}"><br><br><button onclick=exp()>Backup (JSON)</button> <input type=file id=imp accept=.json style="width:auto" onchange=imp(this)> <button class=x onclick="if(confirm('Reset all?')){delete localStorage.mi_db;location.reload()}">Reset</button><p class=mu>ডেটা এই ব্রাউজারে সেভ হয়। নিয়মিত Backup নিন।</p>`;
const exp=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)]));a.download='site-backup.json';a.click()};
const imp=el=>{const r=new FileReader();r.onload=()=>{db=Object.assign({},D,JSON.parse(r.result));commit();location.reload()};r.readAsText(el.files[0])};
const V={dash,st:()=>form('st'),reviews,soc:()=>lst('soc'),pages:()=>lst('pages'),works:()=>lst('works'),cats:()=>lst('cats'),cos:()=>lst('cos'),exp:()=>lst('exp'),skills:()=>lst('skills'),p:()=>form('p'),pay:()=>form('pay'),tpl:()=>form('tpl'),orders,msgs,ui,set};
const sv=async()=>{const m=$('#sm');m.textContent='Saving…';try{await commit();DIRTY=0;m.textContent='Saved'}catch(e){m.textContent='Error: '+e.message}};
const find=q=>{q=q.toLowerCase();const o=[],w=(x,p)=>{for(const k in x){if(['orders','msgs','id','pw'].includes(k))continue;const v=x[k],pp=p?p+'.'+k:k;if(v&&typeof v=='object')w(v,pp);else if(typeof v=='string'&&v.length<500&&!v.startsWith('data:')&&(v.toLowerCase().includes(q)||pp.toLowerCase().includes(q)))o.push([pp,v])}};w(db,'');Object.keys(U).forEach(k=>['bn','en'].forEach((l,j)=>{const p='ui.'+k+'_'+l,v=db.ui[k+'_'+l]??U[k][j];if(!o.some(z=>z[0]==p)&&(v.toLowerCase().includes(q)||k.includes(q)))o.push([p,v])}));return o.slice(0,60)};
const srch=()=>{const q=qs.value.trim();res.hidden=!q;app.hidden=!!q;if(q)res.innerHTML=find(q).map(([p,v])=>`<label>${p}</label><input data-p="${p}" value="${esc(v)}">`).join('')||'—'};
const bd=k=>{const n={orders:db.orders.filter(o=>o.status=='pending').length,reviews:db.reviews.filter(r=>r.status=='pending').length,msgs:db.msgs.filter(m=>!m.read).length}[k];return n?`<b class=nb>${n}</b>`:''};
const show=()=>{const n=db.orders.filter(o=>o.status=='pending').length,nr=db.reviews.filter(r=>r.status=='pending').length;mn.innerHTML=`<div id=sb><button onclick=sv()>${ic('save',16)} Save</button> <span id=sm class=mu>${DIRTY?'● Unsaved changes':''}</span><span id=sw>${ic('search',16)}<input id=qs placeholder="Search any text to edit or delete…" oninput=srch()></span></div><div id=res hidden></div><div id=app><div class=tabs>${Object.keys(TABS).map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';show()"><span>${TABS[k]}</span>${bd(k)}</button>`).join('')}</div><div>${V[tab]()}</div></div>`};
mn.oninput=e=>{const p=e.target.dataset.p;if(!p||e.target.type=='file')return;const a=p.split('.');let o=db;a.slice(0,-1).forEach(k=>o=o[k]);o[a.at(-1)]=e.target.type=='checkbox'?e.target.checked:e.target.value;save()};
mn.onchange=e=>{const el=e.target;if(el.dataset.g&&el.files.length){const [o,k]=pa(el.dataset.g);o[k]=o[k]||[];let n=el.files.length;[...el.files].forEach(f=>img2(f,d=>{o[k].push(d);if(!--n){save();show()}}));return}if(el.type=='file'&&el.dataset.p&&el.files[0])img2(el.files[0],d=>{const a=el.dataset.p.split('.');let o=db;a.slice(0,-1).forEach(k=>o=o[k]);o[a.at(-1)]=d;save();show()})};
const loginUI=()=>{mn.innerHTML=FBON?`<div style="max-width:340px"><h2>Admin</h2><input id=em type=email placeholder="Email" value="${esc(CFG.adminEmail||'')}"><br><br><input id=pw2 type=password placeholder="Password"><p class=er id=le></p><button onclick=loginFB()>Login</button></div>`:`<div style="max-width:320px"><h2>Admin</h2><input id=pw2 type=password placeholder="Password"><br><br><button onclick="if(pw2.value==db.pw){sessionStorage.mi_a=1;show()}else alert('Wrong')">Login</button><p class=mu>Default: admin123</p></div>`};
const loginFB=()=>firebase.auth().signInWithEmailAndPassword(em.value.trim(),pw2.value).catch(e=>{le.textContent=e.message});
if(FBON){FBN();firebase.auth().onAuthStateChanged(u=>u?loadAll().then(show).catch(e=>{mn.innerHTML='<p class=er>'+e.message+'</p>'}):loginUI())}else if(sessionStorage.mi_a)show();else loginUI();
</script></html>
