<!doctype html><html><meta charset=utf-8><link rel=icon type="image/svg+xml" href=favicon.svg><meta name=viewport content="width=device-width,initial-scale=1"><title>Portfolio</title>
<link rel=stylesheet href=base.css>
<style>#bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}</style>
<div id=nav></div><main><div id=bar></div><div class=grid id=gr></div></main><footer id=ft></footer>
<script src=firebase-config.js></script><script src=store.js></script><script src=fx.js></script><script>
hdr('portfolio');let f=new URLSearchParams(location.search).has('sale')?'sale':'all';
const draw=()=>{bar.innerHTML=[['all',T('all')],...db.cats.map(c=>[c.id,t(c,'name')]),['sale',T('onlysale')],['free',T('free')]].map(([k,l])=>`<button class="${f==k?'':'o'}" onclick="f='${k}';draw()">${l}</button>`).join('');
gr.innerHTML=db.works.filter(w=>f=='all'||(f=='sale'?w.sale:f=='free'?w.free:w.cat==f)).map(card).join('')};draw();
</script></html>
