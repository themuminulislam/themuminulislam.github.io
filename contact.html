<!doctype html><html><meta charset=utf-8><link rel=icon type="image/svg+xml" href=favicon.svg><meta name=viewport content="width=device-width,initial-scale=1"><title>T</title>
<link rel=stylesheet href=base.css>
<style>main{max-width:620px}.lk{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 28px}</style>
<div id=nav></div><main id=bx></main><footer id=ft></footer>
<script src=firebase-config.js></script><script src=store.js></script><script src=fx.js></script><script>
hdr('contact');const p=db.p;
bx.innerHTML=`<h1>${T('contact')}</h1><div class=lk><a class="btn o" href="mailto:${p.email}">${ic('mail',18)} ${p.email}</a><a class="btn o" target=_blank href="https://wa.me/${p.wa}">${ic('whatsapp',18)} WhatsApp</a></div>
<label>${T('name')} *</label><input id=n name=name autocomplete=name><label>${T('email')} *</label><input id=e name=email type=email autocomplete=email><label>${T('msg')} *</label><textarea id=m rows=5></textarea><p class=er id=er></p><button onclick=go()>${T('send')}</button>`;
const go=()=>{const bad=[];if(n.value.trim().length<2)bad.push(T('e_name'));if(!chk.email(e.value.trim()))bad.push(T('e_email'));if(!m.value.trim())bad.push(T('e_msg'));
if(bad.length){er.innerHTML=bad.join('<br>');return}
API.msg({name:n.value.trim(),email:e.value.trim(),msg:m.value.trim(),date:new Date().toISOString(),read:0}).then(()=>{bx.innerHTML=`<div class=ok>${ic('check',34)}</div><p>${T('thx')}</p>`}).catch(()=>{er.textContent='Error — please try again.'})};
</script></html>
