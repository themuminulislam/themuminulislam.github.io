<!doctype html><html><meta charset=utf-8><link rel=icon type="image/svg+xml" href=favicon.svg><meta name=viewport content="width=device-width,initial-scale=1"><title>T</title>
<link rel=stylesheet href=base.css>
<style>.wk{display:grid;grid-template-columns:1.3fr 1fr;gap:40px}.wk .im{aspect-ratio:4/3;border-radius:20px;background-size:cover;background-position:center}.rw{border-bottom:1px solid var(--ln);padding:10px 0}#rv{max-width:640px;margin-top:50px}@media(max-width:720px){.wk{grid-template-columns:1fr;gap:24px}}</style>
<div id=nav></div><main><div class=wk id=bx></div><section id=rv></section></main><footer id=ft></footer>
<script src=firebase-config.js></script><script src=store.js></script><script src=fx.js></script><script>
hdr('portfolio');const w=db.works.find(x=>x.id==new URLSearchParams(location.search).get('id'))||db.works[0],c=db.cats.find(x=>x.id==w.cat)||{},stars=n=>ic('star',16,1).repeat(Math.round(+n)||0),imgs=[w.img,...(w.gallery||[])].filter(Boolean),zoom=w.full!==false&&imgs.length>0;
API.bump('w_'+w.id);window.PT=1;document.title=t(w,'title')+' | '+t(db.p,'name');
const rvd=()=>JSON.parse(localStorage.mi_r||'[]').includes(w.id);
const act=()=>w.free?`<button onclick=fdl()>${T('dlfree')}</button><p class=mu id=fn>${rvd()?'':T('unlock')}</p>`:w.sale?`<h2>৳${w.price}</h2><button onclick="consent(()=>goto('checkout.html?id=${w.id}'))">${T('buy')}</button> <button class=o onclick="cartAdd('${w.id}');this.innerHTML=ic('check',16)">${T('addcart')}</button>`:`<p class=mu>${T('only')}</p>`;
bx.innerHTML=`<div><div class=im style="${bg(w)}${zoom?';cursor:zoom-in':''}" ${zoom?'onclick="lbox(imgs,0)"':''}></div>${zoom&&imgs.length>1?`<div class=gl>${imgs.map((s,i)=>`<img src="${s}" onclick="lbox(imgs,${i})">`).join('')}</div>`:''}</div><div><small class=mu>${t(c,'name')}</small><h1>${t(w,'title')}</h1><p class=rate id=av></p><p>${t(w,'desc')}</p>${act()}<br><br><a class=back href=portfolio.html>${ic('left',16)} ${T('portfolio')}</a></div>`;
const fdl=()=>{if(!rvd()){fn.textContent=T('unlock');rv.scrollIntoView({behavior:'smooth'});return}consent(()=>{if(!w.file){fn.textContent=T('nofile');return}const a=document.createElement('a');a.href=w.file;a.target='_blank';a.download='';a.click();API.bump('downloads')})};
rv.innerHTML=`<h2>${T('reviews')}</h2><div id=rl></div><div id=fm><label>${T('name')} *</label><input id=rn name=name autocomplete=name><label>${T('email')} *</label><input id=re name=email type=email autocomplete=email><label>${T('rate')}</label><select id=rs2>${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select><label>${T('comment')} *</label><textarea id=rt2 rows=3></textarea><p class=er id=er2></p><button onclick=sub()>${T('send')}</button></div>`;
const paint=rs=>{av.innerHTML=rs.length?`${ic('star',16,1)} ${(rs.reduce((s,r)=>s+ +r.stars,0)/rs.length).toFixed(1)} (${rs.length})`:'';rl.innerHTML=rs.map(r=>`<div class=rw><b>${r.name}</b> <span class=rate>${stars(r.stars)}</span><p>${r.text}</p></div>`).join('')||`<p class=mu>${T('norev')}</p>`};
API.approved(w.id).then(paint).catch(()=>paint([]));
const sub=()=>{const bad=[];if(rn.value.trim().length<2)bad.push(T('e_name'));if(!chk.email(re.value.trim()))bad.push(T('e_email'));if(!rt2.value.trim())bad.push(T('e_msg'));
if(bad.length){er2.innerHTML=bad.join('<br>');return}
API.review({work:w.id,name:rn.value.trim(),email:re.value.trim(),stars:+rs2.value,text:rt2.value.trim(),status:'pending',date:new Date().toISOString()}).then(()=>{localStorage.mi_r=JSON.stringify([...JSON.parse(localStorage.mi_r||'[]'),w.id]);fm.innerHTML=`<div class=ok>${ic('check',30)}</div><p>${T('pendrev')}</p>`;if(w.free)fn.textContent=T('unlocked')}).catch(()=>{er2.textContent='Error — please try again.'})};
</script></html>
