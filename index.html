<!doctype html><html><meta charset=utf-8><link rel=icon type="image/svg+xml" href=favicon.svg><meta name=viewport content="width=device-width,initial-scale=1"><title>Home</title>
<link rel=stylesheet href=base.css>
<style>.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:56px;align-items:center;padding:20px 0 70px}.st a{display:block;padding:26px 0;border-top:1px solid var(--ln)}.st a:last-of-type{border-bottom:1px solid var(--ln)}.st small{color:var(--ac);font-weight:700;display:block;font-size:15px}.st b{display:block;font-size:clamp(24px,7vw,var(--hero_size,54px));line-height:1.12;letter-spacing:-.03em;font-weight:var(--hero_weight,700);transition:translate .3s}.st a:hover b{translate:14px 0}.who{margin:0 0 22px}.who b{font-size:20px}.ph{aspect-ratio:4/5;border-radius:34px;border:0;background:radial-gradient(120% 70% at 18% 8%,rgba(255,255,255,.4),transparent 55%),linear-gradient(150deg,var(--ac2),var(--ac)) center/cover;box-shadow:0 40px 90px -40px var(--ac),inset 0 0 0 1px rgba(255,255,255,.28)}.ph::before{content:'';position:absolute;inset:-14px;border:1.5px solid var(--ac);border-radius:46px;opacity:.4;rotate:-3deg;pointer-events:none}.ph::after{content:'';position:absolute;inset:-6px;border:1px solid var(--ln);border-radius:40px;pointer-events:none}.ini{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(70px,14vw,130px);font-weight:700;letter-spacing:-.05em;color:rgba(255,255,255,.3)}.g3{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}.co{display:flex;gap:28px;flex-wrap:wrap;color:var(--mu);margin-top:60px}@media(max-width:820px){.hero{grid-template-columns:1fr;gap:36px}.pw{order:-1;max-width:300px;margin:auto;width:100%}.ph::before{inset:-9px;rotate:-2deg}.ph::after{inset:-4px}.st a{padding:18px 0}}</style>
<div id=nav></div><main>
<section class=hero><div><p class=who><b id=nm></b><br><span class=mu id=rl></span></p><div class=st><a href=portfolio.html><small id=t1></small><b id=s1></b></a><a href="portfolio.html?sale"><small id=t2></small><b id=s2></b></a></div><p id=bi class=mu style="max-width:520px;margin-top:22px"></p></div>
<div class=pw><div class="ph card" id=ph><span class=ini id=ini></span></div><div class=soc id=so style="justify-content:center;margin-top:22px"></div></div></section>
<h2 id=fh></h2><div class="grid g3" id=fg></div><p><a class="btn o" href=portfolio.html id=all></a></p><div class=co id=co></div><div id=sx></div></main><footer id=ft></footer>
<script src=firebase-config.js></script><script src=store.js></script><script src=fx.js></script><script>
hdr('index');const p=db.p;
nm.textContent=t(p,'name');nm.className='gt';rl.textContent=t(p,'role');bi.textContent=t(p,'bio');t1.textContent=T('t1');t2.textContent=T('t2');s1.textContent=t(p,'s1');s2.textContent=t(p,'s2');all.textContent=T('seeall');so.innerHTML=socs();const sh=(el,k)=>{if(db.p[k]===false)el.style.display='none'};sh(document.querySelector('.who'),'show_who');sh(s1.closest('a'),'show_s1');sh(s2.closest('a'),'show_s2');sh(bi,'show_bio');sh(so,'show_soc');
if(db.p.show_stats)API.stats().then(z=>{sx.innerHTML=`<div class=sx><div><b>${z.u}</b><span>${T('visitors')}</span></div><div><b>${z.v}</b><span>${T('views')}</span></div><div><b>${z.d}</b><span>${T('downloads')}</span></div></div>`});
if(p.photo)ph.style.backgroundImage=`url(${p.photo})`;ini.textContent=p.photo?'':t(p,'name').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
fh.textContent=T('feat');fg.innerHTML=db.works.slice(0,3).map(card).join('');
co.innerHTML=db.cos.map(c=>`<a href="${c.url||'#'}">${c.logo?`<img src="${c.logo}" height=24> `:''}${t(c,'name')}</a>`).join('');
</script></html>
